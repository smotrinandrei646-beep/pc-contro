<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSI Control Panel</title>
    <script src="https://telegram.org"></script>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #3b82f6; --text: #f8fafc; --text-muted: #94a3b8; --border: #334155; --success: #22c55e; }
        [data-theme="light"] { --bg: #f1f5f9; --panel: #ffffff; --accent: #2563eb; --text: #0f172a; --text-muted: #64748b; --border: #cbd5e1; }
        [data-theme="hacker"] { --bg: #000; --panel: #0a0f0d; --accent: #00ff66; --text: #00ff66; --text-muted: #00aa44; --border: #00ff66; font-family: monospace; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.2s; -webkit-tap-highlight-color: transparent; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        
        .dashboard { display: flex; flex: 1; flex-direction: column; max-width: 1200px; width: 100%; margin: 0 auto; }
        .sidebar { display: flex; overflow-x: auto; background: var(--panel); border-bottom: 1px solid var(--border); padding: 10px; gap: 8px; sticky: top; z-index: 100; }
        .nav-btn { background: transparent; border: 1px solid transparent; color: var(--text); padding: 10px 16px; font-size: 0.9rem; border-radius: 8px; cursor: pointer; white-space: nowrap; font-weight: 500; }
        .nav-btn.active { background-color: var(--accent); color: #fff; }
        .nav-btn:active { transform: scale(0.95); }

        .main { flex: 1; padding: 15px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .server-config { background: rgba(59, 130, 246, 0.1); border: 1px solid var(--accent); padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        .server-config input { width: 100%; padding: 10px; margin-top: 6px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 6px; font-family: monospace; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .cmd-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 18px 10px; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 0.9rem; text-align: center; font-weight: 500; }
        .cmd-btn:hover { border-color: var(--accent); }
        .cmd-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.05); }
        
        .explorer { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .exp-nav { display: flex; align-items: center; background: rgba(0,0,0,0.2); padding: 10px 15px; border-bottom: 1px solid var(--border); gap: 12px; }
        .back-btn { background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .back-btn:active { transform: scale(0.92); }
        .path-text { font-family: monospace; color: var(--text-muted); word-break: break-all; font-size: 0.85rem; }
        
        .exp-list { list-style: none; max-height: 350px; overflow-y: auto; }
        .exp-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid var(--border); }
        .exp-item:last-child { border-bottom: none; }
        .item-click { display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 1; padding: 4px 0; }
        .item-name { font-weight: 500; font-size: 0.95rem; }
        .pc-open-btn { background: var(--success); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .pc-open-btn:active { transform: scale(0.92); }
        #exp-status { padding: 15px; color: var(--text-muted); font-size: 0.9rem; }
        
        @media (min-width: 768px) {
            .dashboard { flex-direction: row; }
            .sidebar { width: 240px; flex-direction: column; border-bottom: none; border-right: 1px solid var(--border); overflow-x: visible; }
            .nav-btn { width: 100%; text-align: left; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- Навигация -->
        <nav class="sidebar">
            <button class="nav-btn active" data-tab="spy">👁️ Шпионаж</button>
            <button class="nav-btn" data-tab="sound">🔊 Звук & Плеер</button>
            <button class="nav-btn" data-tab="programs">📂 Проводник</button>
            <button class="nav-btn" data-tab="power">⚡ Питание</button>
            <button class="nav-btn" data-tab="style">🎨 Стили</button>
        </nav>

        <!-- Главный экран -->
        <main class="main">
            <div class="server-config">
                <label>🌐 Ссылка из бота (ngrok):</label>
                <input type="text" id="pc-api-url" placeholder="https://ngrok-free.app">
            </div>

            <!-- ШПИОНАЖ -->
            <div id="tab-spy" class="tab-content active">
                <div class="grid">
                    <button class="cmd-btn" data-action="screenshot">📸 <span>Скриншот экрана</span></button>
                    <button class="cmd-btn" data-action="webcam">📷 <span>Веб-камера</span></button>
                </div>
            </div>

            <!-- ЗВУК -->
            <div id="tab-sound" class="tab-content">
                <div class="grid">
                    <button class="cmd-btn" data-action="volume_up">🔊 <span>Громче</span></button>
                    <button class="cmd-btn" data-action="volume_down">🔉 <span>Тише</span></button>
                    <button class="cmd-btn" data-action="mute">🔇 <span>Мут звука</span></button>
                </div>
            </div>

            <!-- ПРОГРАММЫ / ПРОВОДНИК -->
            <div id="tab-programs" class="tab-content">
                <div class="explorer">
                    <div class="exp-nav">
                        <button class="back-btn" id="btn-exp-back">⬅️ Назад</button>
                        <span class="path-text" id="current-path">root</span>
                    </div>
                    <div id="exp-status">Загрузка структуры...</div>
                    <ul class="exp-list" id="explorer-list"></ul>
                </div>
            </div>

            <!-- ПИТАНИЕ -->
            <div id="tab-power" class="tab-content">
                <div class="grid">
                    <button class="cmd-btn" data-action="ram_info">📊 <span>RAM Память</span></button>
                    <button class="cmd-btn" data-action="lock_win">🔒 <span>Блок Win+L</span></button>
                    <button class="cmd-btn" data-action="shutdown">🛑 <span>Выключить ПК</span></button>
                </div>
            </div>

            <!-- СТИЛИ -->
            <div id="tab-style" class="tab-content">
                <div class="grid">
                    <button class="cmd-btn" data-theme-set="dark">🌑 <span>Тёмная</span></button>
                    <button class="cmd-btn" data-theme-set="light">☀️ <span>Светлая</span></button>
                    <button class="cmd-btn" data-theme-set="hacker">🟢 <span>Хакер</span></button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentPath = "root";
        let pathHistory = [];

        // Инициализация при старте страницы
        document.addEventListener("DOMContentLoaded", () => {
            const savedUrl = localStorage.getItem("pc_api_endpoint");
            if (savedUrl) {
                document.getElementById('pc-api-url').value = savedUrl;
            }
            setupEventListeners();
            loadDirectory("root");
        });

        // Навешиваем обработчики событий (Защита от ложных и некликающих тапов)
        function setupEventListeners() {
            // Переключение вкладок
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                    
                    const tabId = btn.getAttribute('data-tab');
                    btn.classList.add('active');
                    document.getElementById(`tab-${tabId}`).classList.add('active');
                });
            });

            // Клики по обычным кнопкам действий
            document.querySelectorAll('.cmd-btn[data-action]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const action = btn.getAttribute('data-action');
                    triggerAction(action, "");
                });
            });

            // Клики по кнопкам смены темы
            document.querySelectorAll('.cmd-btn[data-theme-set]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const theme = btn.getAttribute('data-theme-set');
                    document.documentElement.setAttribute('data-theme', theme);
                });
            });

            // Кнопка назад в проводнике
            document.getElementById('btn-exp-back').addEventListener('click', () => {
                if (pathHistory.length > 0) {
                    loadDirectory(pathHistory.pop());
                } else if (currentPath !== "root") {
                    loadDirectory("root");
                }
            });

            // Отслеживание ручного ввода ссылки ngrok
Use code with caution.
document.getElementById('pc-api-url').addEventListener('change', (e) => {
localStorage.setItem("pc_api_endpoint", e.target.value.trim());
loadDirectory("root");
});
}
// Запрос к ПК через fetch
async function triggerAction(actionName, extraPath = "") {
const endpoint = document.getElementById('pc-api-url').value.trim();
if (!endpoint) return;
try {
const response = await fetch(endpoint, {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ action: actionName, path: extraPath })
});
const result = await response.json();
if (actionName === "list_dir") {
renderExplorer(result);
}
} catch (error) {
console.error(error);
document.getElementById('exp-status').innerText = "Ошибка соединения. Проверь статус ngrok.";
}
}
function loadDirectory(path) {
document.getElementById('exp-status').style.display = 'block';
document.getElementById('exp-status').innerText = "Получение списка файлов...";
document.getElementById('explorer-list').innerHTML = '';
currentPath = path;
document.getElementById('current-path').innerText = path;
triggerAction("list_dir", path);
}
// Отрисовка Проводника с абсолютной изоляцией кликов
function renderExplorer(jsonData) {
document.getElementById('exp-status').style.display = 'none';
const list = document.getElementById('explorer-list');
list.innerHTML = '';
if (jsonData.error) {
document.getElementById('exp-status').style.display = 'block';
document.getElementById('exp-status').innerText = "Ошибка: " + jsonData.error;
return;
}
if (jsonData.current_path !== "root") {
currentPath = jsonData.current_path;
}
// Выводим папки
jsonData.folders.forEach(folder => {
const fullPath = currentPath === "root" ? folder : currentPath + '\' + folder;
const li = document.createElement('li');
li.className = 'exp-item';
li.innerHTML = <div class="item-click"> <span>📁</span> <span class="item-name">${folder}</span> </div> <button class="pc-open-btn">🖥️ На ПК</button>;
// Обработчик входа в папку
li.querySelector('.item-click').addEventListener('click', () => {
pathHistory.push(currentPath);
loadDirectory(fullPath);
});
// Обработчик удаленного открытия папки прямо на ПК
li.querySelector('.pc-open-btn').addEventListener('click', (e) => {
e.stopPropagation();
triggerAction('open_item', fullPath);
});
list.appendChild(li);
});
// Выводим файлы
jsonData.files.forEach(file => {
const fullPath = currentPath + '\' + file;
const li = document.createElement('li');
li.className = 'exp-item';
li.innerHTML = <div class="item-click" style="cursor: default;"> <span>📄</span> <span class="item-name">${file}</span> </div> <button class="pc-open-btn">🖥️ На ПК</button>;
// Обработчик удаления / запуска файла на ПК
li.querySelector('.pc-open-btn').addEventListener('click', () => {
triggerAction('open_item', fullPath);
});
list.appendChild(li);
});
}
